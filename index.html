<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BV Seguros: corretora de seguros. Automóvel, vida, saúde, multirriscos habitação e acidentes de trabalho, com acompanhamento próximo em cada apólice." />
    <meta name="robots" content="index, follow" />

    <!--
      geo.* has no ICBP/county-level registry to draw from until the
      client's real morada is confirmed (see the PorConfirmar markers on
      the Home and legal pages), so this stays country-level only. Add
      geo.placename / geo.position once that address is final.
    -->
    <meta name="geo.region" content="PT" />
    <meta name="geo.country" content="Portugal" />

    <meta property="og:title" content="BV Seguros: Seguros e Soluções" />
    <meta property="og:description" content="Corretora de seguros independente: comparamos, explicamos sem jargão e acompanhamos no sinistro." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BV Seguros" />
    <meta property="og:locale" content="pt_PT" />
    <meta property="og:image" content="/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BV Seguros: Seguros e Soluções" />
    <meta name="twitter:description" content="Corretora de seguros independente: comparamos, explicamos sem jargão e acompanhamos no sinistro." />
    <meta name="twitter:image" content="/images/og-image.jpg" />
    <title>BV Seguros: Seguros e Soluções</title>

    <!--
      InsuranceAgency structured data. Deliberately omits address/
      telephone: unlike the on-page PorConfirmar placeholders (visibly
      flagged, read by a human), a fake address/phone here would be
      machine-read by search engines and could surface in results
      before anyone catches it. Add postalAddress/telephone once the
      real values replace the PorConfirmar markers, not before.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "InsuranceAgency",
        "name": "BV Seguros",
        "description": "Corretora de seguros independente: comparamos, explicamos sem jargão e acompanhamos no sinistro.",
        "url": "/",
        "logo": "/images/logo-bv-seguros.png",
        "areaServed": "PT"
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!--
      Google Consent Mode v2: default state, denied until the visitor
      answers the cookie banner (src/components/feedback/CookieConsent.tsx
      calls gtag('consent', 'update', ...) through
      src/utils/googleConsentMode.ts). Must run before gtag.js loads.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      window.gtag = gtag;

      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
        functionality_storage: "denied",
        personalization_storage: "denied",
        security_storage: "granted",
        wait_for_update: 500
      });

      gtag("set", "ads_data_redaction", true);
      gtag("set", "url_passthrough", true);
    </script>

    <!--
      Google Analytics 4. G-XXXXXXX is a placeholder: replace with the
      real Measurement ID before launch (invalid IDs like this one are
      silently ignored by Google's endpoint, no data goes anywhere in
      the meantime). Config'd with send_page_view: false because the
      SPA router (src/app/router.ts) does not reload between pages;
      wire a page_view send into router.ts's navigate() once real
      page-level reporting is needed, instead of double-counting the
      initial load.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX"></script>
    <script>
      gtag("js", new Date());
      gtag("config", "G-XXXXXXX", { send_page_view: false });
    </script>

    <!--
      Meta Pixel. Loads in a consent-revoked state (mirrors Google
      Consent Mode's default-denied pattern above): no event, not even
      the automatic PageView, fires until the visitor grants marketing
      consent (src/utils/metaPixel.ts, called from useCookieConsent.ts).
      PIXEL_ID_AQUI is a placeholder: replace with the real Pixel ID
      before launch.
    -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('consent', 'revoke');
      fbq('init', 'PIXEL_ID_AQUI');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
