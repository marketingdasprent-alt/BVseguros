    <!--
      Google Consent Mode v2: default state, denied until the visitor
      answers the cookie banner (src/components/feedback/CookieConsent.tsx
      calls gtag('consent', 'update', ...) through
      src/utils/googleConsentMode.ts). Must run before gtag.js or any
      other analytics/ads script loads, even on a project with no GA4/Ads
      account yet: the default-denied state is what makes future
      analytics additions consent-safe from day one.

      When the project gets a real GA4 measurement ID, add the gtag.js
      loader (<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX">
      plus `gtag('config', 'G-XXXXXXX')`) after this block, not before it.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      window.gtag = gtag;

      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
        functionality_storage: "denied",
        personalization_storage: "denied",
        security_storage: "granted",
        wait_for_update: 500
      });

      gtag("set", "ads_data_redaction", true);
      gtag("set", "url_passthrough", true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
